name = "elevate-seo-audit"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
FIREBASE_PROJECT_ID = "elevatewebdesigns-1fc3d"
ADMIN_EMAIL = "dewaalb3@gmail.com"
ALLOWED_ORIGINS = "https://elevatewebdesign.co.za,https://www.elevatewebdesign.co.za,https://elevatewebdesigns-1fc3d.web.app,https://elevatewebdesigns-1fc3d.firebaseapp.com"

# Secret (optional, enables AI recommendations — never commit it):
#   npx wrangler secret put ANTHROPIC_API_KEY

# ── Public Quick SEO Check (free-seo-check.html) ──
# Daily-limit counters (created with: npx wrangler kv namespace create QUICK_LIMITS)
[[kv_namespaces]]
binding = "QUICK_LIMITS"
id = "3f46472150234e3ab91464c40698c82e"

# Turnstile secret from Cloudflare dashboard → Turnstile → your widget:
#   npx wrangler secret put TURNSTILE_SECRET

# ── Public Website Growth scans (website-growth.html) ──
# Exact per-session request budgets and daily limits (free plan, SQLite-backed).
[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Limiter"]
