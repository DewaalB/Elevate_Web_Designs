<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Elevate Web Design</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='50,8 92,88 8,88' fill='none' stroke='%2300d4ff' stroke-width='7' stroke-linejoin='round'/%3E%3C/svg%3E">

  <!-- Installable-app metadata — required by iOS before "Add to Home Screen"
       creates a real standalone app rather than just a bookmark, which is
       what makes push notifications possible on iPhone at all. -->
  <link rel="manifest" href="/admin-manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Elevate Admin">
  <meta name="theme-color" content="#070e1a">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- ═══ LOGIN VIEW ═══ -->
  <div id="login-view" class="auth-wrap">
    <form id="login-form" class="auth-card">
      <div class="auth-logo">ELEVATE <span class="accent">ADMIN</span></div>
      <p class="auth-sub">Sign in to manage your leads.</p>

      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <div class="password-field">
          <input type="password" id="login-password" autocomplete="current-password" required>
          <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password" aria-pressed="false">👁</button>
        </div>
      </div>

      <button type="submit" class="auth-btn" id="login-btn">Sign In</button>
      <button type="button" class="auth-link" id="forgot-btn">Forgot password?</button>
      <p class="auth-error" id="login-error"></p>
    </form>
  </div>

  <!-- ═══ DASHBOARD VIEW ═══ -->
  <div id="dash-view" class="dash-wrap" hidden>

    <header class="dash-header">
      <div class="dash-logo">ELEVATE <span class="accent">ADMIN</span></div>
      <div class="dash-header-actions">
        <button class="alerts-btn" id="push-btn">📲 Enable Push (works when closed)</button>
        <button class="alerts-btn" id="alerts-btn" hidden>🔔 Enable Desktop Alerts</button>
        <button class="bell-btn" id="bell-btn" title="New leads since you last checked">
          🔔<span class="bell-badge" id="unread-badge" hidden>0</span>
        </button>
        <button class="logout-btn" id="logout-btn">Log Out</button>
      </div>
    </header>

    <main class="dash-main">

      <section class="stats-row" id="stats-row">
        <div class="stat-card">
          <div class="stat-num" id="stat-total">0</div>
          <div class="stat-label">Total Leads</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="stat-week">0</div>
          <div class="stat-label">This Week</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="stat-month">0</div>
          <div class="stat-label">This Month</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="stat-top-package">—</div>
          <div class="stat-label">Top Package</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="stat-revenue">R0</div>
          <div class="stat-label">Revenue Won</div>
        </div>
      </section>

      <!-- ═══ QUOTE CALCULATOR ═══ -->
      <section class="quote-section">
        <button class="quote-toggle" id="quote-toggle" aria-expanded="false">
          <span>🧮 Quote Calculator</span>
          <span class="quote-chevron" id="quote-chevron">▾</span>
        </button>

        <div class="quote-body" id="quote-body" hidden>
          <div class="quote-grid">

            <div class="quote-inputs">
              <div class="quote-row">
                <div class="quote-field">
                  <label for="q-client">Client / business name</label>
                  <input type="text" id="q-client" placeholder="Jane Smith">
                </div>
                <div class="quote-field">
                  <label for="q-phone">WhatsApp number</label>
                  <input type="tel" id="q-phone" placeholder="082 000 0000">
                </div>
              </div>

              <div class="quote-row">
                <div class="quote-field">
                  <label for="q-pages">Pages</label>
                  <input type="number" id="q-pages" value="3" min="1" max="50">
                </div>
                <div class="quote-field">
                  <label for="q-revisions">Rounds of changes</label>
                  <input type="number" id="q-revisions" value="2" min="0" max="20">
                </div>
                <div class="quote-field">
                  <label for="q-urgency">Timeline (weeks)</label>
                  <input type="number" id="q-urgency" value="4" min="1" max="12">
                </div>
              </div>

              <div class="quote-subhead">Extra features</div>
              <div class="quote-features" id="q-features"></div>

              <div class="quote-row">
                <div class="quote-field">
                  <label for="q-care">Care plan</label>
                  <select id="q-care"></select>
                </div>
              </div>

              <label class="quote-check">
                <input type="checkbox" id="q-discount">
                First-time client discount (R500 off)
              </label>
            </div>

            <div class="quote-output">
              <div class="quote-breakdown" id="q-breakdown"></div>

              <div class="quote-final">
                <div class="quote-final-label">
                  Quote this amount
                  <button type="button" class="quote-reset" id="q-reset" hidden title="Reset to calculated amount">↺ reset</button>
                </div>
                <div class="quote-final-input">
                  <span>R</span><input type="number" id="q-final" min="0" step="50">
                </div>
              </div>
              <p class="quote-range" id="q-range"></p>

              <textarea id="q-text" class="quote-text" rows="14" readonly></textarea>
              <div class="quote-actions">
                <button class="quote-btn primary" id="q-copy">Copy Quote</button>
                <button class="quote-btn" id="q-whatsapp">Send on WhatsApp</button>
                <button class="quote-btn" id="q-print">Print Quote</button>
              </div>
            </div>

          </div>
        </div>
      </section>

      <section class="toolbar">
        <input type="text" id="search-input" class="search-input" placeholder="Search by name, email, or message...">
        <select id="status-filter" class="status-filter">
          <option value="">All statuses</option>
          <option value="New">New</option>
          <option value="Contacted">Contacted</option>
          <option value="Won">Won</option>
          <option value="Lost">Lost</option>
        </select>
        <select id="sort-select" class="status-filter">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="value">Highest value first</option>
          <option value="name">Name (A-Z)</option>
        </select>
        <button class="refresh-btn" id="refresh-btn" title="Refresh">⟳</button>
        <button class="alerts-btn" id="export-btn" title="Download all leads as a CSV file">⬇ Export CSV</button>
      </section>

      <section id="leads-list" class="leads-list">
        <p class="empty-state" id="empty-state">Loading leads…</p>
      </section>

    </main>
  </div>

  <div id="lead-toast" class="lead-toast" hidden>
    <div class="lead-toast-icon">🔔</div>
    <div class="lead-toast-body">
      <strong id="lead-toast-title">New lead!</strong>
      <span id="lead-toast-msg"></span>
    </div>
  </div>

  <pre id="print-quote-output" style="display:none;"></pre>

  <div class="confirm-overlay" id="confirm-overlay">
    <div class="confirm-modal">
      <p class="confirm-message" id="confirm-message"></p>
      <div class="confirm-actions">
        <button type="button" class="quote-btn" id="confirm-cancel-btn">Cancel</button>
        <button type="button" class="quote-btn primary confirm-danger" id="confirm-ok-btn">Delete</button>
      </div>
    </div>
  </div>

  <script src="pricing.js"></script>
  <script type="module" src="admin.js"></script>
</body>
</html>
